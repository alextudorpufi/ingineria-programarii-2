# so MVC slice tests can start without a real environment secret.
app.security.jwt.secret=test-only-marketplace-jwt-secret-0123456789abcdef0123456789abcdef
app.security.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
