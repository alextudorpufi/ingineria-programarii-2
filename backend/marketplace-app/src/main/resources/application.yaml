spring:
  application:
    name: marketplace
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}
    username: ${DB_USER:marketplace}
    password: ${DB_PASSWORD:local_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  security:
    jwt:
      # Override in every real environment. HMAC-SHA256 requires at least 32 bytes.
      secret: ${JWT_SECRET:dev-only-marketplace-jwt-secret-change-me-32b}
    cors:
      # Comma-separated browser origins allowed to call the API.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
