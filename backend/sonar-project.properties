# SonarQube configuration for Backend (Java / Spring Boot)
sonar.projectKey=marketplace-backend
sonar.projectName=Marketplace Backend
sonar.projectVersion=0.0.1-SNAPSHOT

# Source and test paths
sonar.sources=marketplace-domain/src/main/java,marketplace-application/src/main/java,marketplace-infrastructure/src/main/java,marketplace-app/src/main/java
sonar.tests=marketplace-application/src/test/java,marketplace-infrastructure/src/test/java,marketplace-app/src/test/java
sonar.java.binaries=marketplace-domain/target/classes,marketplace-application/target/classes,marketplace-infrastructure/target/classes,marketplace-app/target/classes

# Exclusions
sonar.exclusions=**/target/**,**/.mvn/**
sonar.test.inclusions=**/*Test.java,**/*Tests.java

# Encoding
sonar.sourceEncoding=UTF-8
