name: Secrets Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # Pin the scanner so CI is reproducible. Bump deliberately.
  GITLEAKS_VERSION: "8.24.3"

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install gitleaks ourselves instead of using gitleaks-action, whose
      # internal download has no retry and fails the job on transient 5xx
      # responses from GitHub's release CDN.
      - name: Install gitleaks
        run: |
          set -euo pipefail

          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${install_dir}"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
                --retry 5 --retry-delay 5 --retry-all-errors \
                --connect-timeout 15 --max-time 180 \
                "${url}" --output "${RUNNER_TEMP}/${archive}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::Could not download gitleaks ${GITLEAKS_VERSION} after 5 attempts"
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Download attempt ${attempt} failed; retrying in ${delay}s..."
            sleep "${delay}"
          done

          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" \
              --directory "${install_dir}" gitleaks
          "${install_dir}/gitleaks" version
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
