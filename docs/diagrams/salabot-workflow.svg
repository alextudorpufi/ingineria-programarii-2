<text x="1220" y="687" text-anchor="middle" font-size="13">Edits invalidate confirmation and preview.</text>
<text x="1220" y="716" text-anchor="middle" font-size="13">Preview never charges or unlocks contacts.</text>
<text x="1220" y="745" text-anchor="middle" font-size="13">LLM never chooses professionals.</text>
<text x="1220" y="774" text-anchor="middle" font-size="13">No matches never weakens constraints.</text>
<text x="1220" y="803" text-anchor="middle" font-size="13">Publication can have zero eligible leads.</text>
<text x="1220" y="832" text-anchor="middle" font-size="13">Eligibility is rechecked on distribution.</text>
