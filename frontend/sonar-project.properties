# SonarQube configuration for Frontend (Next.js / TypeScript)
sonar.projectKey=marketplace-frontend
sonar.projectName=Marketplace Frontend
sonar.projectVersion=0.1.0

# Source files
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/public/**,**/*.d.ts

# Encoding and environment
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=browser,node
