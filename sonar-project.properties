# Root SonarQube configuration for unified Monorepo analysis
sonar.projectKey=marketplace
sonar.projectName=Intelligent Services Marketplace
sonar.projectVersion=1.0

# Sources and Tests
sonar.sources=backend/src/main/java,frontend/app
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/target/**,**/.mvn/**,**/public/**,**/*.d.ts
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Encoding
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=browser,node
