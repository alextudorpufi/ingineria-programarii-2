# Root SonarQube configuration for unified Monorepo analysis
sonar.projectKey=marketplace
sonar.projectName=Intelligent Services Marketplace
sonar.projectVersion=1.0

# Sources and Tests
sonar.sources=backend/marketplace-domain/src/main/java,backend/marketplace-application/src/main/java,backend/marketplace-infrastructure/src/main/java,backend/marketplace-app/src/main/java,frontend
sonar.tests=backend/marketplace-application/src/test/java,backend/marketplace-infrastructure/src/test/java,backend/marketplace-app/src/test/java,frontend
sonar.java.binaries=backend/marketplace-domain/target/classes,backend/marketplace-application/target/classes,backend/marketplace-infrastructure/target/classes,backend/marketplace-app/target/classes

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/target/**,**/.mvn/**,**/public/**,**/*.d.ts,**/.scannerwork/**
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Encoding
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=browser,node
